name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  gem:
    name: gem (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Build gem
        run: gem build select2-foundation.gemspec

      - name: Install built gem (with runtime deps)
        run: |
          gem install --local select2-foundation-*.gem
          gem list select2-foundation

      - name: Require the gem
        run: |
          ruby -e "require 'select2-foundation'; raise 'VERSION missing' unless Select2Foundation::VERSION; puts 'Loaded select2-foundation ' + Select2Foundation::VERSION"

      - name: Resolve with foundation-rails 6.9 in a sample app
        run: |
          mkdir -p ci-resolve && cd ci-resolve
          cat > Gemfile <<'EOF'
          source 'https://rubygems.org'
          gem 'rails', '~> 7.1'
          gem 'foundation-rails', '~> 6.9'
          gem 'select2-rails', '~> 4.0'
          gem 'select2-foundation', path: '..'
          EOF
          bundle install
          bundle list | grep -E "select2-foundation|foundation-rails|select2-rails"

  npm:
    name: npm (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build SCSS
        run: npm run build

      - name: Verify dist output
        run: |
          test -s dist/select2-foundation-theme.css || { echo "dev CSS not produced"; exit 1; }
          test -s dist/select2-foundation-theme.min.css || { echo "prod CSS not produced"; exit 1; }
          echo "dev:  $(wc -c < dist/select2-foundation-theme.css) bytes"
          echo "prod: $(wc -c < dist/select2-foundation-theme.min.css) bytes"
