name: CI

on:
  push:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gem:
    # Checks the gemspec across the whole Ruby range it claims to support.
    # No bundle here on purpose: this is the "someone runs gem install" path.
    name: gem (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Build gem
        run: gem build select2-foundation.gemspec

      - name: Install built gem (with runtime deps)
        run: |
          gem install select2-foundation-*.gem
          gem list select2-foundation

      - name: Require the gem and its engine
        run: ruby -e 'require "select2-foundation"; puts Select2Foundation::VERSION'

      - name: Verify the styleguide view ships in the gem
        run: |
          gem contents select2-foundation | grep -q 'app/views/select2-foundation/styleguide/_examples.html.erb' \
            || { echo "styleguide partial missing from the packaged gem"; exit 1; }

  test:
    # Runs the suite against the test/styleguide06 sample app. Needs Ruby 3.2+
    # because dart-sass (sass-embedded) does.
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run test suite
        run: bundle exec rake test

  styleguide:
    # Boots the sample app the same way a contributor does and checks the demo
    # page and both asset bundles actually come back.
    name: styleguide app boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install app dependencies
        working-directory: test/styleguide06
        run: bundle install --jobs 4

      - name: Boot the app and fetch the styleguide page
        working-directory: test/styleguide06
        run: |
          bundle exec rails s -p 3000 -b 127.0.0.1 &
          timeout 120 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:3000/; do sleep 1; done'

          curl -sf http://127.0.0.1:3000/ -o page.html
          grep -q 'js-example-basic-single-foundation' page.html \
            || { echo "styleguide markup missing"; exit 1; }

          for path in $(grep -oE '(href|src)="/assets/[^"]*"' page.html | sed -E 's/.*"(\/assets\/[^"]*)"/\1/'); do
            echo "fetching $path"
            curl -sf -o /dev/null "http://127.0.0.1:3000$path" \
              || { echo "asset $path failed to build"; exit 1; }
          done

  npm:
    name: npm (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build SCSS
        run: npm run build

      - name: Verify dist output
        run: |
          test -s dist/select2-foundation-theme.css || { echo "dev CSS not produced"; exit 1; }
          test -s dist/select2-foundation-theme.min.css || { echo "prod CSS not produced"; exit 1; }
          echo "dev:  $(wc -c < dist/select2-foundation-theme.css) bytes"
          echo "prod: $(wc -c < dist/select2-foundation-theme.min.css) bytes"
